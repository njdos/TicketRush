name: TicketRush CI/CD Pipeline

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'catalog/**'
      - 'reservation/**'
      - 'payment/**'
      - 'pom.xml'
      - '.github/workflows/ci-cd.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'catalog/**'
      - 'reservation/**'
      - 'payment/**'
      - 'pom.xml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and infrastructure verification?'
        required: false
        default: false
        type: boolean

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build, Test, and Quality Check

    env:
      SPRING_PROFILE: test
      DB_CATALOG: catalog_db
      DB_RESERVATION: reservation_db
      DB_PAYMENT: payment_db
      REDIS_PORT: 6379
      JVM_OPTIMIZED_OPTIONS: "-Xms512m -Xmx512m"
      JVM_GC_LOGS: "-Xlog:gc"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests & SonarQube Analysis
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORG: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          echo "=== Running Multi-Module Tests & Static Analysis ==="
          for MODULE in catalog reservation payment; do
            if [ "$MODULE" = "catalog" ]; then GATE=true; else GATE=false; fi
            mvn -B clean verify sonar:sonar -Pintegration-tests \
              -f $MODULE/pom.xml \
              -Dsonar.token=$SONAR_TOKEN \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.organization=$SONAR_ORG \
              -Dsonar.projectKey=${SONAR_ORG}_ticketrush-$MODULE \
              -Dsonar.qualitygate.wait=$GATE
          done

      - name: Debug JaCoCo files
        if: always()
        run: ls -la catalog/target/jacoco.exec catalog/target/site/jacoco/ || true

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always() && github.event.inputs.skip_tests != 'true'
        with:
          name: Maven Test Results
          path: '**/target/*-reports/*.xml'
          reporter: java-junit
          fail-on-error: true

      - name: Package Applications (Fallback if tests skipped)
        if: ${{ github.event.inputs.skip_tests == 'true' }}
        run: |
          echo "=== Compiling JAR Artifacts Only ==="
          mvn -B -f catalog/pom.xml package -DskipTests -Dmaven.javadoc.skip=true
          mvn -B -f reservation/pom.xml package -DskipTests -Dmaven.javadoc.skip=true
          mvn -B -f payment/pom.xml package -DskipTests -Dmaven.javadoc.skip=true


      - name: Inject Infrastructure Secrets & Context
        run: |
          mkdir -p secrets init-scripts
          echo "postgres_admin" > secrets/postgres_user.txt
          echo "supersecretpassword" > secrets/postgres_password.txt
          echo "MkU3OEVBNTcwNTJENDM2Qk" > secrets/kafka_cluster_id.txt


      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Images
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "=== Building and Tagging Images ==="
          DOCKER_REGISTRY=$DOCKER_USER TAG=latest docker compose build
          DOCKER_REGISTRY=$DOCKER_USER TAG=$RUN_NUMBER docker compose build

      - name: Spin up Infrastructure via Docker Compose
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "=== Normalizing Line Endings for Init Scripts (CRLF to LF) ==="
          find . -name "*.sh" -exec sed -i 's/\r$//' {} +
          echo "=== Granting Executable Permissions to Init Scripts ==="
          chmod +x init-scripts/01-init-databases.sh
          echo "=== Deploying Local Mesh for Verification ==="
          DOCKER_REGISTRY=$DOCKER_USER TAG=latest docker compose up -d

      - name: Verify Architecture Health & Inspect Logs
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: |
          echo "=== Waiting for Containers Health Status ==="
          for i in {1..12}; do
            UNHEALTHY=$(docker compose ps --format json | grep -c '"HealthStatus":"unhealthy"') || true
            STARTING=$(docker compose ps --format json | grep -c '"HealthStatus":"starting"') || true
            if [ "$UNHEALTHY" -eq 0 ] && [ "$STARTING" -eq 0 ]; then
               echo "✅ All containers are healthy!"
               break
            fi
            echo "Waiting for services to initialize... ($((i*5))s)"
            sleep 5
          done

          docker compose ps
          
          echo "=== Scanning Logs for Critical Errors ==="
          SERVICES=("catalog-service" "reservation-service" "payment-service")
          for SERVICE in "${SERVICES[@]}"; do
            if docker compose logs $SERVICE | grep -q "ERROR"; then
              echo "❌ Service $SERVICE contains critical errors!"
              docker compose logs $SERVICE --tail=100
              exit 1
            fi
            echo "✅ Service $SERVICE: Clean logs"
          done

      - name: Push Docker Images to Registry
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "=== Publishing Production Images ==="
          SERVICES=("tr-catalog-service" "tr-reservation-service" "tr-payment-service")
          for SERVICE in "${SERVICES[@]}"; do
            docker push $DOCKER_USER/$SERVICE:latest
            docker push $DOCKER_USER/$SERVICE:$RUN_NUMBER
          done

      - name: Teardown Infrastructure
        if: always()
        run: |
          echo "=== Cleaning Environment and Purging Volumes ==="
          docker compose down -v
