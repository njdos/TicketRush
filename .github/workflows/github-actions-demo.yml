name: TicketRush CI/CD

on:
  pull_request:
    branches: [ main ]
    paths: [ 'catalog/**', 'reservation/**', 'payment/**', 'pom.xml', 'docker-compose.yml', '.github/workflows/**' ]
  push:
    branches: [ main ]
    paths: [ 'catalog/**', 'reservation/**', 'payment/**', 'pom.xml', 'docker-compose.yml' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Build & Quality (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: catalog
            gate: true
            has_tests: true
          - module: reservation
            gate: false
            has_tests: false
          - module: payment
            gate: false
            has_tests: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify + Sonar
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -f ${{ matrix.module }}/pom.xml \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ vars.SONAR_ORGANIZATION }}_ticketrush-${{ matrix.module }} \
            -Dsonar.qualitygate.wait=${{ matrix.gate }}

      - name: Verify only (fork PRs, no Sonar)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: mvn -B clean verify -f ${{ matrix.module }}/pom.xml

      - name: Publish test report
        if: always() && matrix.has_tests
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5
        with:
          name: Tests (${{ matrix.module }})
          path: '${{ matrix.module }}/target/*-reports/*.xml'
          reporter: java-junit

  docker:
    name: Build, Smoke Test & Push
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKER_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
      TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Package JARs
        run: mvn -B package -DskipTests

      - name: Generate throwaway CI secrets
        run: |
          mkdir -p secrets
          echo "ci_admin" > secrets/postgres_user.txt
          openssl rand -hex 16 > secrets/postgres_password.txt
          openssl rand -hex 11 > secrets/kafka_cluster_id.txt

      - name: Build images (once)
        run: docker compose build

      - name: Smoke test (compose up, wait for healthchecks)
        run: |
          find . -name "*.sh" -exec sed -i 's/\r$//' {} +
          chmod +x init-scripts/*.sh
          docker compose up -d --wait --wait-timeout 120
          for S in catalog-service reservation-service payment-service; do
            if docker compose logs $S | grep -q " ERROR "; then
              docker compose logs $S --tail=100; exit 1
            fi
          done

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images (sha + latest)
        run: |
          for S in tr-catalog-service tr-reservation-service tr-payment-service; do
            docker tag $DOCKER_REGISTRY/$S:$TAG $DOCKER_REGISTRY/$S:latest
            docker push $DOCKER_REGISTRY/$S:$TAG
            docker push $DOCKER_REGISTRY/$S:latest
          done

      - name: Teardown
        if: always()
        run: docker compose down -v