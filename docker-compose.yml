networks:
  public-edge:
    name: tr-public-edge
    driver: bridge
  internal-mesh:
    name: tr-internal-mesh
    driver: bridge
  secure-data:
    name: tr-secure-data
    driver: bridge
#    internal: true

volumes:
  pg_cluster_data:
  redis_cache_data:
  prometheus_data:
  grafana_data:

secrets:
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  kafka_cluster_id:
    file: ./secrets/kafka_cluster_id.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt

services:
  catalog-service:
    build:
      context: ./catalog
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-local}/tr-catalog-service:${TAG:-latest}
    container_name: tr-catalog-service
    ports:
      - "127.0.0.1:8085:8081"
    networks:
      - public-edge
      - internal-mesh
      - secure-data
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure:5
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres_user
      - postgres_password
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_CATALOG}
      - SPRING_CONFIG_IMPORT=optional:configtree:/run/secrets/
      - SPRING_DATASOURCE_USERNAME=$${postgres_user}
      - SPRING_DATASOURCE_PASSWORD=$${postgres_password}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JDK_JAVA_OPTIONS=${JVM_OPTIMIZED_OPTIONS}
      - GC_LOG_OPTIONS=${JVM_GC_LOGS}
    mem_limit: 768M
    cpus: '2.0'

  reservation-service:
    build:
      context: ./reservation
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-local}/tr-reservation-service:${TAG:-latest}
    container_name: tr-reservation-service
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - public-edge
      - internal-mesh
      - secure-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure:5
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres_user
      - postgres_password
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_RESERVATION}
      - SPRING_CONFIG_IMPORT=optional:configtree:/run/secrets/
      - SPRING_DATASOURCE_USERNAME=$${postgres_user}
      - SPRING_DATASOURCE_PASSWORD=$${postgres_password}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JDK_JAVA_OPTIONS=${JVM_OPTIMIZED_OPTIONS}
      - GC_LOG_OPTIONS=${JVM_GC_LOGS}
    mem_limit: 768M
    cpus: '2.0'

  payment-service:
    build:
      context: ./payment
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-local}/tr-payment-service:${TAG:-latest}
    container_name: tr-payment-service
    ports:
      - "127.0.0.1:8086:8083"
    networks:
      - public-edge
      - internal-mesh
      - secure-data
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure:5
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres_user
      - postgres_password
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_PAYMENT}
      - SPRING_CONFIG_IMPORT=optional:configtree:/run/secrets/
      - SPRING_DATASOURCE_USERNAME=$${postgres_user}
      - SPRING_DATASOURCE_PASSWORD=$${postgres_password}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JDK_JAVA_OPTIONS=${JVM_OPTIMIZED_OPTIONS}
      - GC_LOG_OPTIONS=${JVM_GC_LOGS}
    mem_limit: 768M
    cpus: '2.0'

  postgres:
    image: postgres:15-alpine
    container_name: tr-postgres-cluster
    ports:
      - "5433:5432"
    networks:
      - secure-data
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres_user
      - postgres_password
    environment:
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_MULTIPLE_DATABASES=${DB_CATALOG},${DB_RESERVATION},${DB_PAYMENT}
    volumes:
      - pg_cluster_data:/var/lib/postgresql/data
      - ./init-scripts:/mnt/init-scripts
    command:
      - sh
      - -c
      - |
        tr -d '\r\357\273\277' < /mnt/init-scripts/01-init-databases.sh > /docker-entrypoint-initdb.d/01-init-databases.sh
        chmod +x /docker-entrypoint-initdb.d/01-init-databases.sh
        exec docker-entrypoint.sh postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user)" ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: tr-redis-cache
    ports:
      - "6379:6379"
    networks:
      - secure-data
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tr-kafka-broker
    ports:
      - "9092:9092"
      - "9094:9094"
    networks:
      - internal-mesh
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,LOCAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,LOCAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,LOCAL://localhost:9094
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tr-kafka-dashboard
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - public-edge
      - internal-mesh
    depends_on:
      kafka:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      - KAFKA_CLUSTERS_0_NAME=ticketrush-local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tr-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - internal-mesh
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 512M
    cpus: '1.0'

  grafana:
    image: grafana/grafana:11.3.1
    container_name: tr-grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal-mesh
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    secrets:
      - grafana_admin_password
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/services-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 384M
    cpus: '1.0'