apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketrush-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - http:
        paths:
          - path: /api/v1/catalog
            pathType: Prefix
            backend:
              service:
                name: catalog-service
                port:
                  number: 8081

          - path: /api/v1/reservation
            pathType: Prefix
            backend:
              service:
                name: reservation-service
                port:
                  number: 8082

          - path: /api/v1/payment
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 8083
