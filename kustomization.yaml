apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ticketrush

secretGenerator:
  - name: tr-secrets
    type: Opaque
    files:
      - kafka_cluster_id=./secrets/kafka_cluster_id.txt
      - postgres_password=./secrets/postgres_password.txt
      - postgres_user=./secrets/postgres_user.txt

configMapGenerator:
  - name: postgres-init-script
    files:
      - ./init-scripts/01-init-databases.sh

resources:
  - ./k8s/namespace
  - ./k8s/catalog
  - ./k8s/reservation
  - ./k8s/payment
  - ./k8s/postgres
  - ./k8s/redis
  - ./k8s/kafka
  - ./k8s/infrastructure