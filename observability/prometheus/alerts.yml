groups:
  - name: services
    rules:
      - alert: ServiceInstanceDown
        expr: up{job=~"catalog|reservation|payment"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.instance }}) is down"

      - alert: ServiceHigh5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job=~"catalog|reservation|payment",status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{job=~"catalog|reservation|payment"}[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "More than 5% of requests fail with 5xx"

      - alert: ServiceHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job=~"catalog|reservation|payment"}[5m]))) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency is above 1s"

      - alert: CatalogCircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Circuit breaker '{{ $labels.name }}' has been open for 1m (dependency is failing)"

      - alert: CatalogOutboxLagHigh
        expr: catalog_outbox_oldest_pending_age_seconds > 60
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Oldest outbox event has waited {{ $value }}s: Kafka publishing is lagging"

      - alert: CatalogOutboxFailedEvents
        expr: catalog_outbox_events{status="FAILED"} > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $value }} outbox events exhausted all attempts and need manual attention"

      - alert: ServiceHikariPoolSaturated
        expr: hikaricp_connections_active{job=~"catalog|reservation|payment"} / hikaricp_connections_max{job=~"catalog|reservation|payment"} > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "DB connection pool is >90% used"

      - alert: ServiceHeapUsageHigh
        expr: |
          sum(jvm_memory_used_bytes{job=~"catalog|reservation|payment",area="heap"})
            / sum(jvm_memory_max_bytes{job=~"catalog|reservation|payment",area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "JVM heap is >90% used"
