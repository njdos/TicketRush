global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: catalog
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["catalog-service:8081"]

  - job_name: reservation
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["reservation-service:8082"]

  - job_name: payment
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8083"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
